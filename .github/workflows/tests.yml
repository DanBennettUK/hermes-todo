name: Tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install tzdata fastapi pydantic httpx
      - run: npm ci --prefix tests/desktop --ignore-scripts
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: server-plugin/hermes-todo
      - run: python -m compileall -q server-plugin tests
      - run: node --check desktop-plugin/hermes-todo/plugin.js
